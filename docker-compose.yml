name: rank-monitor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=512MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: rank_monitor
      POSTGRES_USER: rank_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在服务器环境文件设置 POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rank_monitor -d rank_monitor"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    cpus: 0.70
    logging: *default-logging
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在服务器环境文件设置 POSTGRES_PASSWORD}
    volumes: ["./infra/schema.sql:/schema.sql:ro"]
    command: ["sh", "-c", "psql -h postgres -U rank_monitor -d rank_monitor -v ON_ERROR_STOP=1 -f /schema.sql"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    restart: "no"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    cpus: 0.25
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=512
      DATA_MODE: postgres
      AUTH_MODE: production
      AUTH_SECRET: ${AUTH_SECRET:?请在服务器环境文件设置 AUTH_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?请设置完整站点 URL，例如 https://rank.example.com}
      APP_DOMAIN: ${APP_DOMAIN:?请设置站点域名，例如 rank.example.com}
      METERING_MODE: ${METERING_MODE:-disabled}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?请设置初始管理员邮箱}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-管理员}
      INITIAL_ADMIN_POINTS: ${INITIAL_ADMIN_POINTS:-0}
      DATABASE_URL: postgresql://rank_monitor:${POSTGRES_PASSWORD}@postgres:5432/rank_monitor
      DATABASE_POOL_MAX: 8
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:?请设置 SMTP 主机}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?请设置 SMTP 用户名}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?请设置 SMTP 密码或授权码}
      SMTP_FROM: ${SMTP_FROM:?请设置发件地址}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      DATABASE_URL: postgresql://rank_monitor:${POSTGRES_PASSWORD}@postgres:5432/rank_monitor
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 1
      WORKER_VERSION: worker-0.2.0
    volumes: ["worker_evidence:/app/evidence"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    shm_size: 512mb
    mem_limit: 2g
    cpus: 1.50
    logging: *default-logging
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?请设置站点域名}
      TLS_EMAIL: ${TLS_EMAIL:?请设置证书通知邮箱}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.20
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  worker_evidence:
  caddy_data:
  caddy_config:
